<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>AVELIOR — Digital Identity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Archivo:wdth,wght@125,700;125,800&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --text: #f5f5f5;
      --text-soft: #d4d4d4;
      --muted: #9a9a9a;
      --line: rgba(255,255,255,.08);
      --line-strong: rgba(255,255,255,.14);
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
      --wordmark: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font: 15px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(900px 520px at 85% -10%, rgba(255,255,255,.09), transparent 60%),
        radial-gradient(700px 420px at -10% 110%, rgba(255,255,255,.04), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* soft film grain, same as the website */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    main {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 44px 28px 34px;
      text-align: center;
      border-radius: 26px;
      background:
        linear-gradient(118deg, transparent 28%, rgba(255,255,255,.055) 44%, transparent 58%),
        radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.07), transparent 60%),
        linear-gradient(180deg, #161616 0%, #0b0b0b 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,.12) inset,
        0 0 0 1px rgba(255,255,255,.08),
        0 40px 90px -30px rgba(0,0,0,.9);
      animation: rise .9s var(--ease) both;
    }

    /* NFC tap mark with a gentle pulse */
    main::before {
      content: "";
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto 26px;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f5f5f5' stroke-width='1.6' stroke-linecap='round'><path d='M8 8.6a4.6 4.6 0 0 1 0 6.8'/><path d='M11.6 6a8.4 8.4 0 0 1 0 12'/><path d='M15.2 3.4a12.2 12.2 0 0 1 0 17.2'/></svg>") center / 28px no-repeat,
        radial-gradient(circle at 30% 25%, #2a2a2a, #121212);
      animation: pulse 2.4s var(--ease) infinite;
    }

    .brand {
      margin-bottom: 22px;
      font-family: var(--wordmark);
      font-weight: 800;
      font-stretch: 125%;
      font-variation-settings: "wdth" 125;
      font-size: 15px;
      letter-spacing: .32em;
      padding-left: .32em;
      color: var(--text);
    }

    .brand::after {
      content: "";
      display: block;
      width: 36px;
      height: 1px;
      margin: 18px auto 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    }

    h1 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(30px, 8vw, 38px);
      line-height: 1.08;
      letter-spacing: -.01em;
      color: var(--text);
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #actions { margin-top: 6px; }
    #actions:empty { display: none; }

    a { color: var(--text); }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      padding: 15px 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 100%);
      color: #0b0b0b;
      text-decoration: none;
      font: 700 12.5px/1 var(--sans);
      letter-spacing: .1em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px -10px rgba(255,255,255,.35);
      transition: transform .25s var(--ease), box-shadow .25s var(--ease);
    }

    .button:hover { transform: translateY(-1px); box-shadow: 0 14px 36px -10px rgba(255,255,255,.45); }
    .button:active { transform: translateY(0); }

    .hidden { display: none; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,.18); }
      70% { box-shadow: 0 0 0 16px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main, main::before { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">AVELIOR</div>
    <h1 id="title">Connecting your identity</h1>
    <p id="message">Please wait while we find your profile.</p>
    <p id="actions"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://gqxmwqpdqxyhmazoqrac.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable__wh7bVqUNfktiaomD1aOvQ__XJav_Mf";

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const actions = document.getElementById("actions");

    function showUnavailable(heading, detail) {
      title.textContent = heading;
      message.textContent = detail;
    }

    async function openCard() {
      const cardCode =
        new URLSearchParams(location.search).get("id")?.trim();

      if (!cardCode || !/^[A-Za-z0-9_-]{1,60}$/.test(cardCode)) {
        showUnavailable(
          "Invalid card link",
          "Please check the link or contact AVELIOR support."
        );
        return;
      }

      const { data, error } = await client.rpc(
        "get_public_card_profile",
        { p_card_code: cardCode }
      );

      if (error) {
        console.error("Card lookup failed:", error);
        showUnavailable(
          "Unable to connect",
          "Please check your internet connection and try again."
        );
        return;
      }

      const result = Array.isArray(data) ? data[0] : null;

      if (!result?.username) {
        showUnavailable(
          "Your AVELIOR card is not linked yet",
          "The card owner must activate this card from their AVELIOR account. If you purchased this card, use the activation instructions provided with it."
        );

        const link = document.createElement("a");
        link.className = "button";
        link.href = "./";
        link.textContent = "Go to AVELIOR";
        actions.replaceChildren(link);
        return;
      }

      title.textContent = "Opening your profile";
      message.textContent = "Taking you to the card owner's public profile.";

      location.replace("./?u=" + encodeURIComponent(result.username));
    }

    openCard().catch(error => {
      console.error("Unexpected card error:", error);
      showUnavailable(
        "Something went wrong",
        "Please try again later."
      );
    });
  </script>
</body>
</html>
