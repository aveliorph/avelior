
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>AVELIOR — Digital Identity</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 36px 24px;
      text-align: center;
      background: linear-gradient(145deg, #1b1b1b, #0d0d0d);
      border: 1px solid #363636;
      border-radius: 22px;
    }

    .brand {
      letter-spacing: 6px;
      font-size: 17px;
      margin-bottom: 32px;
    }

    h1 { font-size: 25px; }

    p {
      color: #aaa;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    a { color: #fff; }

    .button {
      display: inline-block;
      margin-top: 14px;
      padding: 13px 18px;
      border-radius: 8px;
      background: #f5f5f5;
      color: #080808;
      text-decoration: none;
      font-weight: bold;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">AVELIOR</div>
    <h1 id="title">Connecting your identity</h1>
    <p id="message">Please wait while we find your profile.</p>
    <p id="actions"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://gqxmwqpdqxyhmazoqrac.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable__wh7bVqUNfktiaomD1aOvQ__XJav_Mf";

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const actions = document.getElementById("actions");

    function showUnavailable(heading, detail) {
      title.textContent = heading;
      message.textContent = detail;
    }

    async function openCard() {
      const cardCode =
        new URLSearchParams(location.search).get("id")?.trim();

      if (!cardCode || !/^[A-Za-z0-9_-]{1,60}$/.test(cardCode)) {
        showUnavailable(
          "Invalid card link",
          "Please check the link or contact AVELIOR support."
        );
        return;
      }

      const { data, error } = await client.rpc(
        "get_public_card_profile",
        { p_card_code: cardCode }
      );

      if (error) {
        console.error("Card lookup failed:", error);
        showUnavailable(
          "Unable to connect",
          "Please check your internet connection and try again."
        );
        return;
      }

      const result = Array.isArray(data) ? data[0] : null;

      if (!result?.username) {
        showUnavailable(
          "Your AVELIOR card is not linked yet",
          "The card owner must activate this card from their AVELIOR account. If you purchased this card, use the activation instructions provided with it."
        );

        const link = document.createElement("a");
        link.className = "button";
        link.href = "./";
        link.textContent = "Go to AVELIOR";
        actions.replaceChildren(link);
        return;
      }

      title.textContent = "Opening your profile";
      message.textContent = "Taking you to the card owner's public profile.";

      location.replace("./?u=" + encodeURIComponent(result.username));
    }

    openCard().catch(error => {
      console.error("Unexpected card error:", error);
      showUnavailable(
        "Something went wrong",
        "Please try again later."
      );
    });
  </script>
</body>
</html>
